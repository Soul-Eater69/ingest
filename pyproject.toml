[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo4j-ingest"
version = "0.1.0"
description = "Config-driven framework to ingest data from various sources into Neo4j as nodes and relationships"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "requests>=2.28",
    "sqlalchemy>=2.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
]
spark = [
    "pyspark>=3.4",
]

[project.scripts]
neo4j-ingest = "neo4j_ingest.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
