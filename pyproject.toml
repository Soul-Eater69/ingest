[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo4j-ingest"
version = "0.1.0"
description = "Config-driven framework to ingest data from various sources into Neo4j as nodes and relationships"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "neo4j>=5.0",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.28",
    "sqlalchemy>=2.0",
    "click>=8.0",
    # codebase-indexer core dependencies
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "numpy>=1.26.0",
    "rank-bm25>=0.2.2",
    "watchdog>=3.0.0",
    "aiofiles>=23.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.0",
    "httpx>=0.27.0",
]
spark = [
    "pyspark>=3.4",
]
openai = [
    "openai>=1.12.0",
]
qdrant = [
    "qdrant-client>=1.7.0",
]
chroma = [
    "chromadb>=0.4.22",
]
local-embed = [
    "sentence-transformers>=2.6.0",
]
rerank = [
    "sentence-transformers>=2.6.0",
]
all = [
    "chromadb>=0.4.22",
    "sentence-transformers>=2.6.0",
    "openai>=1.12.0",
    "qdrant-client>=1.7.0",
]

[project.scripts]
neo4j-ingest = "neo4j_ingest.cli:main"
cidx = "codebase_indexer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
